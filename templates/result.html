<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediction Result</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="overlay">
    <div class="main-card" style="max-width:700px;">
        <!-- Header -->
        <div class="header-section">
            <img src="{{ url_for('static', filename='header.png') }}" class="header-image">
            <h1>Prediction Result</h1>
        </div>

        <!-- Info blocks with prediction highlight -->
        <div class="content-section">
            {% for cls in class_names %}
            {% if cls == prediction %}
            <div class="info-block" style="border-left-color: #28a745;">{{ cls }} ✅</div>
            {% else %}
            <div class="info-block">{{ cls }}</div>
            {% endif %}
            {% endfor %}
        </div>

        <!-- Uploaded image & prediction -->
        <div class="result-section">
            <h2>Uploaded Image</h2>
            <img src="{{ image_path }}" class="uploaded-preview">
            <h2>Prediction: {{ prediction }}</h2>
            <p>Confidence: {{ confidence }}%</p>
            <a href="{{ url_for('home') }}"><button>Upload Another Image</button></a>
        </div>

        {% if error %}
        <div class="error-section">
            <p style="color:red;">{{ error }}</p>
        </div>
        {% endif %}

    </div>
</div>
</body>
</html>
